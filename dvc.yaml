stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
      - src/data/data_ingestion.py
      - data/raw/data.csv
    
    outs:
      - data/interim/data_cleaned.csv

  data_preperation:
    cmd: python src/data/data_preperation.py

    params:
    - data_preperation.test_size
    - data_preperation.random_state
    deps:
      - src/data/data_preperation.py
      - data/interim/data_cleaned.csv
    
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
      - src/data/data_preprocessing.py
      - data/processed/train.csv
      - data/processed/test.csv
    outs:
      - data/preprocessed/train.csv
      - data/preprocessed/test.csv
