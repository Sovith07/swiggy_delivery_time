stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
      - src/data/data_ingestion.py
      - data/raw/data.csv
    
    outs:
      - data/interim/data_cleaned.csv

  data_preperation:
    cmd: python src/data/data_preperation.py

    params:
    - data_preperation.test_size
    - data_preperation.random_state
    deps:
      - src/data/data_preperation.py
      - data/interim/data_cleaned.csv
    
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
      - src/data/data_preprocessing.py
      - data/processed/train.csv
      - data/processed/test.csv
    outs:
      - data/preprocessed/train.csv
      - data/preprocessed/test.csv

  train_model:
    cmd: python src/models/train_model.py
    params:
      - train_model.XGBoost
      - train_model.LightGBM
    deps:
      - src/models/train_model.py
      - data/preprocessed/train.csv
      - data/preprocessed/test.csv
    outs:
      - models/stacking_regressor.joblib
      - models/model.joblib
      - models/power_transformer.joblib

  evaluate_model:
    cmd: python src/models/evaluate_model.py
    deps:
      - src/models/evaluate_model.py
      - models/stacking_regressor.joblib
      - models/model.joblib
      - models/power_transformer.joblib
      - data/preprocessed/train.csv
      - data/preprocessed/test.csv

  register_model:
    cmd: python src/models/register_model.py
    deps:
      - src/models/register_model.py
